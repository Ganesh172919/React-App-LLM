services:
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: medassist_root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set a random Mongo root password}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set a different random hex app password}
    volumes:
      - medassist-mongo:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/app.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username medassist_root --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://medassist_app:${MONGO_APP_PASSWORD}@mongo:27017/medassist
      CLIENT_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: uniquelocal
      STRUCTURED_LOGS: "true"
      JWT_ACCESS_TOKEN: ${JWT_ACCESS_TOKEN:?set JWT_ACCESS_TOKEN}
      JWT_REFRESH_TOKEN: ${JWT_REFRESH_TOKEN:?set JWT_REFRESH_TOKEN}
      JWT_VERIFICATION_TOKEN: ${JWT_VERIFICATION_TOKEN:?set JWT_VERIFICATION_TOKEN}
      JWT_RESET_TOKEN: ${JWT_RESET_TOKEN:?set JWT_RESET_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      TOGETHER_MODEL: ${TOGETHER_MODEL:-}
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-}
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-}
      USER_API_KEY_ENCRYPTION_KEY: ${USER_API_KEY_ENCRYPTION_KEY:-}
      GEMINI_VERIFY_ANSWERS: ${GEMINI_VERIFY_ANSWERS:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@example.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-MedAssist AI}
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
volumes:
  medassist-mongo:
