name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  dataset-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s "Model and Dataset" -p "test_*.py"
      - run: python -m unittest discover -s "Model and Dataset/lora" -p "test_*.py"
      - run: python "Model and Dataset/analyze_dataset.py" --output-dir "$RUNNER_TEMP/dataset-reports"
      - run: python "Model and Dataset/audit_dataset.py" --output-dir "$RUNNER_TEMP/dataset-reports"
      - run: python "Model and Dataset/lora/build_lora_package.py" --output "$RUNNER_TEMP/lora-prepared"
      - run: python "Model and Dataset/lora/train_lora.py" --data-dir "$RUNNER_TEMP/lora-prepared"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run build
      - name: Start isolated production-bundle fixture stack
        run: |
          node scripts/run_build_qa.cjs --fixtures > /tmp/medassist-api.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173/api/ready && curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/medassist-api.log
          exit 1
      - run: node scripts/check_build_serving.cjs
      - run: APP_URL=http://127.0.0.1:4173 node scripts/browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: output/qa/

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node deploy/create_env.cjs
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: curl --fail http://localhost:8080/api/ready
      - run: curl --fail http://localhost:8080/healthz
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
