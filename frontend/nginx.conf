# ============================================================================
# MEDASSIST AI - FRONTEND NGINX CONFIGURATION (nginx.conf)
# ============================================================================
# Role:
#   High-performance reverse proxy and static asset server for the React Vite SPA.
#
# Key Features:
#   - Security Headers: Nosniff, Referrer-Policy, Permissions-Policy.
#   - Healthcheck Endpoint: Lightweight /healthz returning 200 "ok".
#   - REST Proxy: Proxies /api/ requests to http://backend:5000/api/.
#   - WebSocket Upgrade: Proxies /ws with HTTP/1.1 Upgrade and Connection headers.
#   - SPA Fallback: Routes client-side browser navigation to /index.html.
#   - Cache Optimization: 1-year immutable caching on hashed static assets.
#
# ----------------------------------------------------------------------------
# MINDMAP FLOW: NGINX REQUEST DISPATCH
# ----------------------------------------------------------------------------
# [Inbound Client Request on Port 80]
#        │
#        ├── /healthz ────────────────► Return 200 "ok" (Docker Healthcheck)
#        ├── /api/* ──────────────────► Proxy to http://backend:5000/api/
#        ├── /ws ─────────────────────► Upgrade to WebSocket (backend:5000/ws)
#        ├── Static Assets (*.js/css) ► Serve with 1y Cache-Control
#        └── Default /* ──────────────► try_files $uri $uri/ /index.html
#
# ----------------------------------------------------------------------------
# ASCII FLOW: REVERSE PROXY DISPATCH
# ----------------------------------------------------------------------------
#  Client Browser
#        │
#        ├── GET /healthz ──────────► [Nginx] ──► 200 OK "ok"
#        ├── GET /assets/index.js ──► [Nginx Cache] ──► 200 (immutable, 1y)
#        ├── GET /chat ─────────────► [Nginx] ──► try_files /index.html (SPA)
#        ├── POST /api/medical ─────► [Nginx] ──► ProxyPass backend:5000/api/medical
#        └── WS /ws (Upgrade) ──────► [Nginx] ──► ProxyPass backend:5000/ws
# ============================================================================
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://backend:5000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 65s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
